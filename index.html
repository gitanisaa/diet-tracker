<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Day Fat Loss Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <header class="app-header">
        <div class="badge-tag">30-DAY CHALLENGE</div>
        <h1>Fat Loss Tracker</h1>
        <p class="subtitle">Consistency is key. Track your daily habits and progress.</p>
    </header>

    <!-- Top Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">⚖️</div>
            <div class="stat-info">
                <span class="label">Start Weight</span>
                <div class="input-wrapper">
                    <input type="number" id="start-weight" step="0.1" placeholder="0.0">
                    <span class="unit">kg</span>
                </div>
            </div>
        </div>
        <div class="stat-card highlight">
            <div class="stat-icon">🔥</div>
            <div class="stat-info">
                <span class="label">Current Weight</span>
                <div class="value" id="current-weight">--</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🎯</div>
            <div class="stat-info">
                <span class="label">Goal Weight</span>
                <div class="input-wrapper">
                    <input type="number" id="goal-weight" step="0.1" placeholder="0.0">
                    <span class="unit">kg</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Progress Bar Section -->
    <div class="progress-section">
        <div class="progress-header">
            <div>
                <h3>Challenge Progress</h3>
                <p class="progress-sub" id="progress-text">0 / 30 Days Logged</p>
            </div>
            <div class="percentage-badge" id="progress-percent">0%</div>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="progress-bar"></div>
        </div>
    </div>

    <!-- 30-Day Grid Section -->
    <div class="grid-header">
        <h2>Daily Logs</h2>
        <span class="grid-hint">Tap a day to view or edit</span>
    </div>
    <div class="grid-container" id="grid"></div>
</div>

<!-- Modal Dialog -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <span class="modal-subtitle">Log Entry</span>
                <h3 id="modal-title">Day 1</h3>
            </div>
            <button class="btn-close" id="btn-close">&times;</button>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Calories Eaten</label>
                <div class="input-box">
                    <input type="number" id="input-calories" placeholder="e.g. 2000">
                    <span class="unit">kcal</span>
                </div>
            </div>

            <div class="form-group">
                <label>Protein Intake</label>
                <div class="input-box">
                    <input type="number" id="input-protein" placeholder="e.g. 150">
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="form-group">
                <label>Walking Distance</label>
                <div class="input-box">
                    <input type="number" id="input-walk" step="0.1" placeholder="e.g. 5.5">
                    <span class="unit">km</span>
                </div>
            </div>

            <div class="form-group">
                <label>Exercise Burned</label>
                <div class="input-box">
                    <input type="number" id="input-burn" placeholder="e.g. 400">
                    <span class="unit">kcal</span>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Weekly Weight Check-in</label>
                <div class="input-box">
                    <input type="number" id="input-weight" step="0.1" placeholder="Leave blank if not weighing today">
                    <span class="unit">kg</span>
                </div>
            </div>
        </div>

        <div class="modal-buttons">
            <button class="btn btn-clear" id="btn-clear">Clear Day</button>
            <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
            <button class="btn btn-primary" id="btn-save">Save Entry</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
